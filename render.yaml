databases:
  - name: skillsprint-db
    plan: free

services:
  - type: web
    name: skillsprint-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillsprint-db
          property: connectionString