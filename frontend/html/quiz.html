<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSprint Quiz Demo</title>
    <link rel="stylesheet" href="../css/quiz.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SkillSprint Quiz</h1>
            <p>Live MCQ demo backed by FastAPI</p>
            <a href="contests.html" style="color:white;font-size:0.9em;text-decoration:underline;opacity:0.85;">Go to Contests &rarr;</a>
        </header>

        <div id="quiz-container">
            <div style="display: grid; gap: 10px; margin-bottom: 20px;">
                <label for="test-id">Test ID</label>
                <input id="test-id" type="number" value="1" min="1" />

                <label for="user-id">User ID</label>
                <input id="user-id" type="number" value="1" min="1" />

                <button id="load-btn" type="button">Load Questions</button>
            </div>

            <p id="status" style="margin-bottom: 15px;"></p>
            <form id="quiz-form"></form>

            <div style="margin-top: 20px;">
                <button id="submit-btn" type="button" disabled>Submit Answers</button>
            </div>

            <div id="result-container" style="display: none; margin-top: 20px;"></div>
        </div>
    </div>

    <script src="../js/quiz.js"></script>
</body>
</html>
