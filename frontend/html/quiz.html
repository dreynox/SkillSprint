<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSprint | Quiz</title>
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="stylesheet" href="../css/ux-foundation.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="student-dashboard.html">Skill<span>Sprint</span></a>
            <nav class="nav-links" aria-label="Main">
                <a class="nav-link" href="student-dashboard.html">Dashboard</a>
                <a class="nav-link" href="contests.html">Contests</a>
                <a class="nav-link active" href="quiz.html">Quiz</a>
                <a class="nav-link" href="leaderboard.html">Leaderboard</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <a class="nav-link" href="message.html">Message</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <header class="page-header">
            <h1>SkillSprint Quiz</h1>
            <p>Test your coding knowledge with multiple choice questions</p>
        </header>

        <div id="quiz-container">
            <div style="display: grid; gap: 10px; margin-bottom: 20px; border: 1px solid rgba(0,255,136,0.25); padding: 12px; border-radius: 10px;">
                <h3 style="margin: 0; color: #00ff88;">Random Question Bank Session</h3>

                <label for="language">Language</label>
                <select id="language" style="padding: 10px; border-radius: 8px; border: 1px solid rgba(0,255,136,0.35); background: rgba(0,0,0,0.7); color: #e0ffe8;">
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="C#">C#</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="SQL">SQL</option>
                    <option value="Go">Go</option>
                    <option value="Rust">Rust</option>
                    <option value="PHP">PHP</option>
                    <option value="R">R</option>
                    <option value="MATLAB">MATLAB</option>
                    <option value="Bash">Bash</option>
                </select>

                <label for="level">Level</label>
                <select id="level" style="padding: 10px; border-radius: 8px; border: 1px solid rgba(0,255,136,0.35); background: rgba(0,0,0,0.7); color: #e0ffe8;">
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>

                <button id="start-random-btn" type="button">Start Random 20 Questions</button>
            </div>

            <div style="display: grid; gap: 10px; margin-bottom: 20px; border: 1px solid rgba(0,255,136,0.15); padding: 12px; border-radius: 10px;">
                <h3 style="margin: 0; color: #9bf7c4;">Legacy Test Mode</h3>
                <label for="test-id">Test ID</label>
                <input id="test-id" type="number" value="1" min="1" />

                <label for="user-id">User ID</label>
                <input id="user-id" type="number" value="1" min="1" />

                <button id="load-btn" type="button">Load Questions</button>
            </div>

            <p id="status" style="margin-bottom: 15px;"></p>

            <div id="timer-box" style="display: none; margin-bottom: 18px; padding: 12px; border: 1px solid rgba(0,255,136,0.22); border-radius: 10px; text-align: center;">
                Time Left: <strong id="timer-value">30:00</strong>
            </div>

            <form id="quiz-form"></form>

            <div style="margin-top: 20px;">
                <button id="submit-btn" type="button" disabled>Submit Answers</button>
            </div>

            <div id="result-container" style="display: none; margin-top: 20px;"></div>
        </div>
    </div>

    <script src="../js/api-base.js"></script>
    <script src="../js/quiz.js"></script>
    <script src="../js/ux-foundation.js"></script>
</body>
</html>
