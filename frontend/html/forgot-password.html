<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSprint | Forgot Password</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="cursor-glow"></div>
  <canvas id="matrix"></canvas>

  <div class="login-card">
    <h1 class="terminal-title">SkillSprint<span class="cursor">_</span></h1>
    <p class="subtitle">Reset your password via email OTP</p>

    <div id="generalError" class="error-message"></div>

    <form id="requestOtpForm">
      <div class="input-group">
        <input type="email" id="email" required placeholder="Email" />
      </div>
      <button type="submit" id="requestOtpBtn"><span>SEND OTP</span></button>
    </form>

    <p id="otpMessage" class="footer-text" style="opacity: 0.95; margin-top: 12px;"></p>

    <form id="verifyOtpForm" style="display: none; margin-top: 14px;">
      <div class="input-group">
        <input type="text" id="otp" required maxlength="6" placeholder="Enter 6-digit OTP" />
      </div>

      <div class="input-group password">
        <input type="password" id="newPassword" required placeholder="New Password" />
      </div>

      <div class="input-group password">
        <input type="password" id="confirmNewPassword" required placeholder="Confirm New Password" />
      </div>

      <button type="submit" id="verifyOtpBtn"><span>VERIFY OTP & RESET</span></button>
    </form>

    <p class="footer-text">
      Back to login?
      <a href="../../index.html">Return</a>
    </p>
  </div>

  <script src="../js/forgot-password.js"></script>
</body>
</html>
