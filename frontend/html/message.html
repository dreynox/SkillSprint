<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSprint | Messages</title>
    <link rel="stylesheet" href="../css/message.css">
</head>
<body class="cyber-arena">
    <div class="hud-background">
        <div class="grid-overlay"></div>
        <div class="scanline"></div>
    </div>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="student-dashboard.html">Skill<span>Sprint</span></a>
            <nav class="nav-links" aria-label="Main">
                <a class="nav-link" href="student-dashboard.html">Dashboard</a>
                <a class="nav-link" href="contests.html">Contests</a>
                <a class="nav-link" href="quiz.html">Quiz</a>
                <a class="nav-link" href="leaderboard.html">Leaderboard</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <a class="nav-link active" href="message.html">Message</a>
            </nav>
        </div>
    </header>

    <div class="chat-wrapper">
        <!-- Conversations Sidebar -->
        <aside class="conversations-panel">
            <div class="panel-header">
                <h3>Conversations</h3>
                <button id="new-chat-btn" class="new-chat-btn" title="Start new chat">+</button>
            </div>
            <div class="conversations-list" id="conversations-list">
                <div class="placeholder">Loading conversations...</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div id="chat-empty" class="chat-empty" style="display: flex;">
                <div class="empty-state">
                    <h2>No Conversation Selected</h2>
                    <p>Select a contact from the left panel to start chatting</p>
                </div>
            </div>

            <div id="chat-area" class="chat-area" style="display: none;">
                <header class="chat-header">
                    <div class="user-info">
                        <div class="status-pulse"></div>
                        <div class="text-group">
                            <h2 class="neon-text" id="chat-user-name">User Name</h2>
                            <span class="sub-text" id="chat-user-status">Online</span>
                        </div>
                    </div>
                    <div class="header-metrics">
                        <button id="voice-call-btn" class="call-btn" title="Voice call">🎤</button>
                    </div>
                </header>

                <main class="message-arena" id="message-display">
                    <div class="placeholder">No messages yet</div>
                </main>

                <footer class="input-console">
                    <form id="chat-form" class="message-input-form">
                        <div class="input-wrapper">
                            <div class="input-toolbar">
                                <button type="button" id="emoji-btn" class="tool-btn" title="Emoji">😊</button>
                                <button type="button" id="file-btn" class="tool-btn" title="Upload file">📎</button>
                                <input type="file" id="file-input" style="display: none;">
                            </div>
                            <textarea 
                                id="msg-input" 
                                placeholder="TYPE_MESSAGE_HERE..." 
                                autocomplete="off"
                                rows="2"
                            ></textarea>
                            <button type="submit" id="send-btn" class="send-btn">SEND</button>
                        </div>
                    </form>
                    <div id="upload-progress" class="upload-progress" style="display: none;">
                        <div class="progress-bar">
                            <div id="progress-fill" style="width: 0%;"></div>
                        </div>
                        <span id="progress-text">Uploading...</span>
                    </div>
                </footer>
            </div>
        </main>
    </div>

    <!-- Voice Call Modal -->
    <div id="voice-modal" class="modal" style="display: none;">
        <div class="modal-content voice-modal">
            <button class="close-btn" id="close-voice-modal">&times;</button>
            <div class="voice-call-container">
                <h2>Voice Call with <span id="voice-call-user"></span></h2>
                <div class="voice-status">
                    <div class="status-indicator"></div>
                    <span id="call-duration">0:00</span>
                </div>
                <div class="voice-controls">
                    <button id="end-call-btn" class="btn btn-danger">End Call</button>
                    <button id="mute-btn" class="btn btn-secondary">Mute</button>
                </div>
            </div>
        </div>
    </div>

    <!-- User Selection Modal -->
    <div id="user-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="close-btn" id="close-user-modal">&times;</button>
            <h2>Select User to Chat</h2>
            <div class="users-list" id="users-list">
                <div class="placeholder">Loading users...</div>
            </div>
        </div>
    </div>

    <script src="../js/api-base.js"></script>
    <script src="../js/message.js"></script>
</body>
</html>
