<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSprint | Result Analysis</title>
  <link rel="stylesheet" href="../css/result.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="student-dashboard.html">Skill<span>Sprint</span></a>
      <nav class="nav-links" aria-label="Main">
        <a class="nav-link" href="student-dashboard.html">Dashboard</a>
        <a class="nav-link" href="contests.html">Contests</a>
        <a class="nav-link" href="quiz.html">Quiz</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
        <a class="nav-link" href="profile.html">Profile</a>
        <a class="nav-link active" href="result.html">Result</a>
      </nav>
    </div>
  </header>

  <header class="app-header">
    <h1>QUIZ RESULT</h1>
    <p class="tagline">Your score and profile details</p>
  </header>

  <section class="summary">
    <div class="stat-card">
      <h3>Score</h3>
      <span id="scoreValue">--</span>
    </div>

    <div class="stat-card">
      <h3>Total Questions</h3>
      <span id="totalValue">--</span>
    </div>

    <div class="stat-card">
      <h3>Unanswered</h3>
      <span id="unansweredValue">--</span>
    </div>

    <div class="stat-card">
      <h3>Mode</h3>
      <span id="modeValue">--</span>
    </div>
  </section>

  <section class="difficulty">
    <h2>Student Details</h2>

    <table>
      <thead>
        <tr>
          <th>Field</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody id="profileTable">
      </tbody>
    </table>
  </section>

  <section class="questions">
    <h2>Quiz Summary</h2>

    <table>
      <thead>
        <tr>
          <th>Quiz Type</th>
          <th>Language</th>
          <th>Level</th>
          <th>Submitted At</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="quizTypeValue">--</td>
          <td id="languageValue">--</td>
          <td id="levelValue">--</td>
          <td id="submittedAtValue">--</td>
        </tr>
      </tbody>
    </table>
  </section>

  <section class="insights">
    <h2>Notes</h2>
    <ul id="noteList"></ul>
  </section>

  <script src="../js/result.js"></script>
</body>
</html>
