<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSprint - Student Sign Up</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="cursor-glow"></div>
    <canvas id="matrix"></canvas>

    <div class="login-card">
        <h1 class="terminal-title">
            SkillSprint<span class="cursor">_</span>
        </h1>
        <p class="subtitle">Create your student account</p>

        <div id="generalError" class="error-message"></div>

        <form id="signupForm">
            <div class="input-group">
                <input type="text" id="name" name="name" required placeholder="Full Name" />
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="input-group">
                <input type="email" id="email" name="email" required placeholder="Email" />
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="input-group">
                <select id="year" name="year" aria-label="Year">
                    <option value="">Select year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>

            <div class="input-group">
                <input type="text" id="branch" name="branch" placeholder="Branch (CSE, ECE, etc.)" />
            </div>

            <div class="input-group password">
                <input type="password" id="password" name="password" required placeholder="Password" />
                <span id="togglePassword">👁</span>
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="input-group password">
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm Password" />
                <span id="toggleConfirmPassword">👁</span>
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <button type="submit" id="signupBtn">
                <span>SIGN UP</span>
            </button>
        </form>

        <p class="footer-text">
            Already have an account?
            <a href="../../index.html">Log in</a>
        </p>

        <p class="footer-text">
            Admin onboarding?
            <a href="admin-signup.html">Admin Sign Up</a>
        </p>

        <p class="footer-text">
            Already an admin?
            <a href="admin-login.html">Admin Log In</a>
        </p>
    </div>

    <script src="../js/signup.js"></script>
</body>
</html>
