<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSprint - Student Sign Up</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/ux-foundation.css">
</head>
<body>
    <div class="cursor-glow"></div>
    <canvas id="matrix"></canvas>

    <div class="login-card signup-card">
        <h1 class="terminal-title">
            SkillSprint<span class="cursor">_</span>
        </h1>
        <p class="subtitle">Create your student account</p>

        <div id="generalError" class="error-message full-width" role="alert" aria-live="assertive"></div>
        <p id="signupStatus" class="helper-text full-width" role="status" aria-live="polite">Fill details to create your account.</p>

        <form id="signupForm" class="signup-grid" novalidate>
            <div class="input-group">
                <input type="text" id="name" name="name" required placeholder="Full Name" autocomplete="name" />
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="input-group">
                <input type="email" id="email" name="email" required placeholder="Email" autocomplete="email" />
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="input-group">
                <input type="text" id="srn" name="srn" placeholder="SRN" />
            </div>

            <div class="input-group">
                <input type="text" id="prn" name="prn" placeholder="PRN" />
            </div>

            <div class="input-group">
                <select id="year" name="year" aria-label="Year">
                    <option value="">Select year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>

            <div class="input-group">
                <input type="text" id="branch" name="branch" placeholder="Branch (CSE, ECE, etc.)" />
            </div>

            <div class="input-group">
                <input type="text" id="division" name="division" placeholder="Division" />
            </div>

            <div class="input-group">
                <input type="text" id="rollNo" name="rollNo" placeholder="Roll No" />
            </div>

            <div class="input-group password">
                <input type="password" id="password" name="password" required placeholder="Password" autocomplete="new-password" aria-describedby="passwordHelp" />
                <span id="togglePassword" class="toggle-icon">👁</span>
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="input-group password">
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm Password" autocomplete="new-password" />
                <span id="toggleConfirmPassword" class="toggle-icon">👁</span>
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <div class="full-width">
                <p id="passwordHelp" class="helper-text">Use at least 6 characters. Stronger passwords are safer.</p>
                <div class="strength-meter" aria-hidden="true"><span id="passwordStrengthBar"></span></div>
                
                <button type="submit" id="signupBtn">
                    <span>SIGN UP</span>
                </button>
            </div>
        </form>

        <div class="footer-links">
            <p class="footer-text">
                Already have an account? <a href="../../index.html">Log in</a>
            </p>
            <p class="footer-text">
                Admin onboarding? <a href="admin-signup.html">Admin Sign Up</a>
            </p>
            <p class="footer-text">
                Already an admin? <a href="admin-login.html">Admin Log In</a>
            </p>
        </div>
    </div>

    <script src="../js/api-base.js"></script>
    <script src="../js/signup.js"></script>
    <script src="../js/ux-foundation.js"></script>
</body>
</html>
