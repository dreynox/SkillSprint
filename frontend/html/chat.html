<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSprint AI | Premium Assistant</title>
  <link rel="stylesheet" href="../css/ux-foundation.css" />
  <link rel="stylesheet" href="../css/chat-widget.css" />
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon" />
  <style>
    :root {
      --bg: #020a06;
      --surface: rgba(4, 18, 12, 0.7);
      --primary: #00ff88;
      --primary-glow: rgba(0, 255, 136, 0.3);
      --glass: blur(20px) saturate(180%);
    }

    body {
      background: var(--bg);
      color: #d9fff0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
      animation: pulse 8s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.2); opacity: 0.6; }
    }

    /* Header Styling */
    .premium-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(0, 255, 136, 0.15);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: var(--glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-group h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-group span {
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
    }

    /* Main Chat Layout */
    .chat-layout {
      flex: 1;
      max-width: 1100px;
      margin: 2rem auto;
      width: 95%;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      overflow: hidden;
    }

    /* Sidebar */
    .chat-sidebar {
      background: var(--surface);
      border: 1px solid rgba(110, 230, 170, 0.1);
      border-radius: 24px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      backdrop-filter: var(--glass);
    }

    .sidebar-section h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: rgba(217, 255, 240, 0.4);
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }

    .nav-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: #d9fff0;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-btn:hover {
      background: rgba(0, 255, 136, 0.08);
      border-color: rgba(0, 255, 136, 0.2);
      transform: translateX(5px);
    }

    /* Full Chat Area */
    .full-chat-area {
      background: var(--surface);
      border: 1px solid rgba(110, 230, 170, 0.1);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: var(--glass);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    #full-messages {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .full-input-area {
      padding: 24px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(110, 230, 170, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }

    #full-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(110, 230, 170, 0.2);
      border-radius: 18px;
      color: #d9fff0;
      padding: 16px;
      font-size: 1rem;
      resize: none;
      max-height: 150px;
      outline: none;
      transition: all 0.3s;
    }

    #full-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
    }

    .premium-send {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #00ff88, #00ccaa);
      border: none;
      border-radius: 18px;
      color: #00140d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
      transition: all 0.3s;
    }

    .premium-send:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 15px 30px rgba(0, 255, 136, 0.3);
    }

    .tools-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lang-selector {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(110, 230, 170, 0.2);
      border-radius: 8px;
      color: #d9fff0;
      padding: 4px 10px;
      font-size: 0.8rem;
      outline: none;
    }

    @media (max-width: 900px) {
      .chat-layout {
        grid-template-columns: 1fr;
      }
      .chat-sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>

  <header class="premium-header">
    <div class="brand-group">
      <h1>Skill<span>Sprint</span> AI</h1>
    </div>
    <div class="header-actions">
      <a href="student-dashboard.html" class="nav-btn" style="width: auto;">Back to Dashboard</a>
    </div>
  </header>

  <main class="chat-layout">
    <aside class="chat-sidebar">
      <div class="sidebar-section">
        <h4>Navigation</h4>
        <a href="contests.html" class="nav-btn">🏆 Contests</a>
        <a href="quiz.html" class="nav-btn">📝 Quizzes</a>
        <a href="leaderboard.html" class="nav-btn">📊 Leaderboard</a>
      </div>
      <div class="sidebar-section">
        <h4>Settings</h4>
        <div style="padding: 12px 16px; font-size: 0.85rem; color: rgba(217, 255, 240, 0.5);">
          AI Model: Gemini 1.5 Flash
        </div>
        <button id="clear-history" class="nav-btn" style="color: #ff7b7b; border-color: rgba(255, 123, 123, 0.1);">
          🗑️ Clear History
        </button>
      </div>
    </aside>

    <section class="full-chat-area">
      <div id="full-messages">
        <!-- Messages will be injected here -->
      </div>

      <div class="full-input-area">
        <div class="tools-bar">
          <div style="display: flex; gap: 12px; align-items: center;">
            <label style="font-size: 0.8rem; color: rgba(217, 255, 240, 0.6);">Mode:</label>
            <select class="lang-selector">
              <option value="en">English (Default)</option>
              <option value="hi">Hindi</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
            </select>
          </div>
          <div id="connection-status" style="font-size: 0.75rem; color: #00ff88;">● Connected</div>
        </div>
        
        <div class="input-wrapper">
          <textarea id="full-input" placeholder="Type your coding question here..." rows="1"></textarea>
          <button id="full-send" class="premium-send">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/api-base.js"></script>
  <script src="../js/chat-widget.js"></script>
  <script>
    // Sync full page chat with the widget instance
    const fullMessages = document.getElementById("full-messages");
    const fullInput = document.getElementById("full-input");
    const fullSend = document.getElementById("full-send");
    const clearHistoryBtn = document.getElementById("clear-history");

    function syncChat() {
      if (!window.chatWidget) return;

      // Update full messages area
      fullMessages.innerHTML = "";
      window.chatWidget.messages.forEach(msg => {
        if (msg.role === "system") return;
        const msgEl = document.createElement("div");
        msgEl.className = `chat-message ${msg.role}`;
        
        let actionsHtml = "";
        if (msg.role === "assistant") {
          actionsHtml = `<div class="message-actions"><button class="action-btn tts-btn">🔊</button></div>`;
        }

        msgEl.innerHTML = `
          <div class="chat-bubble">${window.chatWidget.escapeHtml(msg.content)}</div>
          ${actionsHtml}
        `;
        fullMessages.appendChild(msgEl);
      });
      fullMessages.scrollTop = fullMessages.scrollHeight;
    }

    fullSend.addEventListener("click", () => {
      const text = fullInput.value.trim();
      if (!text) return;
      
      window.chatWidget.input.value = text;
      window.chatWidget.sendMessage();
      fullInput.value = "";
      setTimeout(syncChat, 100);
    });

    fullInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        fullSend.click();
      }
    });

    clearHistoryBtn.addEventListener("click", () => {
      if (confirm("Are you sure you want to clear your chat history?")) {
        localStorage.removeItem("skillsprint_chat_history");
        window.location.reload();
      }
    });

    // Auto-sync every second to catch widget updates
    setInterval(syncChat, 1000);
    
    // Auto-resize full input
    fullInput.addEventListener("input", () => {
      fullInput.style.height = "auto";
      fullInput.style.height = Math.min(fullInput.scrollHeight, 150) + "px";
    });
  </script>
</body>
</html>
