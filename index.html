<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSprint | Student Login</title>
  <link rel="stylesheet" href="frontend/css/login.css" />
</head>
<body>

  <!-- Neon cursor glow -->
  <div class="cursor-glow"></div>

  <!-- Matrix hacker background -->
  <canvas id="matrix"></canvas>

  <!-- Login Card -->
  <div class="login-card">
    
    <!-- Terminal-style title -->
    <h1 class="terminal-title">
      SkillSprint<span class="cursor">_</span>
    </h1>

    <p class="subtitle">Student access portal</p>

    <div id="generalError" class="error-message" style="color: #ff4444; margin-bottom: 1rem; text-align: center;"></div>

    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" required />
        <label>Email</label>
      </div>

      <div class="input-group password">
        <input type="password" id="password" required />
        <label>Password</label>
        <span id="togglePassword">👁</span>
      </div>

      <button type="submit" id="loginBtn">
        <span>AUTHENTICATE</span>
        <div class="loader"></div>
      </button>
    </form>

    <p class="footer-text">
      New user?
      <a href="frontend/html/signup.html">Create access</a>
    </p>

    <p class="footer-text">
      Admin?
      <a href="frontend/html/admin-login.html">Log in as admin</a>
    </p>

    <p class="footer-text" style="margin-top: 1.2rem; font-size: 0.85rem; opacity: 0.7;">
      Sign in to access your dashboard modules.
    </p>
  </div>

  <script src="frontend/js/login.js"></script>
</body>
</html>
